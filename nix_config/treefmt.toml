# `nix fmt` (see modules/flake/formatter.nix).

[global]
# gemset.nix is generated by pkgs.bundlerEnv.
excludes = ["result", "result-*", "**/gemset.nix"]

# deadnix first, it only removes unused bindings; nixfmt then formats what is
# left. (Lower number = higher precedence in treefmt.)
[formatter.deadnix]
command = "deadnix"
includes = ["*.nix"]
options = ["--edit"]
priority = 0

[formatter.nixfmt]
command = "nixfmt"
includes = ["*.nix"]
priority = 1
